<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b579a"/>
      <stop offset="1" stop-color="#22467d"/>
    </linearGradient>
  </defs>

  <!-- 桌面背景 -->
  <rect width="880" height="540" fill="#e9edf2"/>

  <!-- 工作窗口（代表“任意工作页面”） -->
  <rect x="24" y="24" width="832" height="492" rx="10" fill="#ffffff" stroke="#cdd3dc" stroke-width="1.5"/>
  <rect x="24" y="24" width="832" height="40" rx="10" fill="url(#title)"/>
  <rect x="24" y="54" width="832" height="10" fill="url(#title)"/>
  <text x="40" y="50" fill="#ffffff" font-size="15" font-weight="600">季度报表.xlsx — Excel</text>
  <!-- 假表格网格 -->
  <g stroke="#e3e7ee" stroke-width="1">
    <line x1="24" y1="120" x2="856" y2="120"/>
    <line x1="24" y1="180" x2="856" y2="180"/>
    <line x1="24" y1="240" x2="856" y2="240"/>
    <line x1="24" y1="300" x2="856" y2="300"/>
    <line x1="24" y1="360" x2="856" y2="360"/>
    <line x1="24" y1="420" x2="856" y2="420"/>
    <line x1="200" y1="64" x2="200" y2="516"/>
    <line x1="380" y1="64" x2="380" y2="516"/>
    <line x1="560" y1="64" x2="560" y2="516"/>
    <line x1="720" y1="64" x2="720" y2="516"/>
  </g>
  <g fill="#aab2bf" font-size="13">
    <text x="40" y="100">A</text><text x="220" y="100">B</text>
    <text x="400" y="100">C</text><text x="580" y="100">D</text>
    <text x="740" y="100">E</text>
  </g>

  <!-- 浮动行情面板（半透明叠在工作窗口之上） -->
  <g filter="url(#shadow)">
    <rect x="556" y="232" width="286" height="232" rx="14" fill="#ffffff" fill-opacity="0.82" stroke="#c4cad4" stroke-width="1.5"/>
    <!-- 标题行 -->
    <circle cx="578" cy="256" r="7" fill="#e23b3b"/>
    <circle cx="592" cy="256" r="7" fill="#1aa260"/>
    <text x="608" y="261" font-size="14" font-weight="700" fill="#2b2f36">StockTicker</text>
    <text x="812" y="261" font-size="11" fill="#9aa1ad" text-anchor="end">置顶</text>
    <line x1="566" y1="274" x2="832" y2="274" stroke="#d7dce4" stroke-width="1"/>

    <!-- 行 1 -->
    <text x="572" y="300" font-size="13" font-weight="600" fill="#2b2f36">长安汽车</text>
    <text x="700" y="300" font-size="13" fill="#2b2f36" text-anchor="end">12.34</text>
    <text x="828" y="300" font-size="13" font-weight="700" fill="#e23b3b" text-anchor="end">+0.83%</text>
    <!-- 行 2 -->
    <text x="572" y="330" font-size="13" font-weight="600" fill="#2b2f36">上证指数</text>
    <text x="700" y="330" font-size="13" fill="#2b2f36" text-anchor="end">3210.50</text>
    <text x="828" y="330" font-size="13" font-weight="700" fill="#1aa260" text-anchor="end">-0.82%</text>
    <!-- 行 3 -->
    <text x="572" y="360" font-size="13" font-weight="600" fill="#2b2f36">创业板指</text>
    <text x="700" y="360" font-size="13" fill="#2b2f36" text-anchor="end">1980.20</text>
    <text x="828" y="360" font-size="13" font-weight="700" fill="#1aa260" text-anchor="end">-4.22%</text>

    <line x1="566" y1="376" x2="832" y2="376" stroke="#d7dce4" stroke-width="1"/>
    <!-- 迷你 K 线 -->
    <polyline points="576,432 600,420 624,428 648,408 672,416 696,396 720,404 744,388 768,398 792,384 816,392"
      fill="none" stroke="#e23b3b" stroke-width="1.6" opacity="0.85"/>
    <g fill="#1aa260">
      <rect x="598" y="414" width="5" height="10"/>
      <rect x="646" y="402" width="5" height="10"/>
      <rect x="694" y="390" width="5" height="10"/>
      <rect x="742" y="382" width="5" height="10"/>
      <rect x="790" y="378" width="5" height="10"/>
    </g>
    <text x="572" y="452" font-size="10" fill="#9aa1ad">5 分钟 K 线 · 滚轮缩放 · 悬停看数值</text>
  </g>

  <!-- 标注 -->
  <g font-size="13" fill="#2b2f36">
    <!-- 半透明 -->
    <line x1="556" y1="348" x2="470" y2="348" stroke="#3a6ea5" stroke-width="1.5"/>
    <circle cx="556" cy="348" r="3" fill="#3a6ea5"/>
    <rect x="250" y="332" width="218" height="34" rx="8" fill="#3a6ea5"/>
    <text x="266" y="347" fill="#ffffff" font-weight="600">半透明 10%–100% 可调</text>
    <text x="266" y="362" fill="#dce8f7" font-size="11">叠在任意窗口上几乎不挡视线</text>

    <!-- 置顶浮动 -->
    <line x1="814" y1="256" x2="850" y2="200" stroke="#7a4fb0" stroke-width="1.5"/>
    <circle cx="814" cy="256" r="3" fill="#7a4fb0"/>
    <rect x="640" y="172" width="216" height="30" rx="8" fill="#7a4fb0"/>
    <text x="656" y="192" fill="#ffffff" font-weight="600">置顶浮动 · 始终在最上层</text>

    <!-- 无任务栏入口 / 托盘 -->
    <rect x="556" y="492" width="286" height="24" rx="6" fill="#dfe4ec"/>
    <circle cx="820" cy="504" r="5" fill="#e23b3b"/>
    <circle cx="834" cy="504" r="5" fill="#1aa260"/>
    <text x="566" y="508" font-size="11" fill="#5b626d">任务栏无入口，仅托盘小图标常驻</text>

    <!-- 一键隐身 -->
    <rect x="40" y="470" width="300" height="44" rx="10" fill="#1f8f5f"/>
    <text x="56" y="490" fill="#ffffff" font-weight="700" font-size="14">Ctrl + Alt + H 一键隐身</text>
    <text x="56" y="507" fill="#d6f2e4" font-size="11">老板来了，秒隐藏整个窗口</text>
  </g>
</svg>
